name: Money Maker Telegram Automation

on:
  workflow_dispatch:
    inputs:
      category:
        description: "Post category"
        required: true
        default: "product"
        type: choice
        options:
          - welcome
          - store
          - product
          - education
          - strategy
          - faq
          - cta
          - support
          - random

  schedule:
    - cron: "0 9 * * *"
      timezone: "America/New_York"

    - cron: "30 12 * * *"
      timezone: "America/New_York"

    - cron: "30 15 * * *"
      timezone: "America/New_York"

    - cron: "30 18 * * *"
      timezone: "America/New_York"

    - cron: "30 21 * * *"
      timezone: "America/New_York"


jobs:
  telegram-post:

    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
      SUPPORT_USERNAME: ${{ secrets.SUPPORT_USERNAME }}
      STORE_URL: ${{ secrets.STORE_URL }}

    steps:

      - name: Download Money Maker code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Determine post category
        id: category
        shell: bash
        run: |

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then

            CATEGORY="${{ inputs.category }}"

          else

            SCHEDULE="${{ github.event.schedule }}"

            case "$SCHEDULE" in

              "0 9 * * *")
                CATEGORY="education"
                ;;

              "30 12 * * *")
                CATEGORY="product"
                ;;

              "30 15 * * *")
                CATEGORY="strategy"
                ;;

              "30 18 * * *")
                CATEGORY="random"
                ;;

              "30 21 * * *")
                CATEGORY="cta"
                ;;

              *)
                CATEGORY="random"
                ;;

            esac

          fi

          echo "category=$CATEGORY" >> "$GITHUB_OUTPUT"

          echo "======================================"
          echo " MONEY MAKER AUTOMATION"
          echo " Category: $CATEGORY"
          echo "======================================"

      - name: Publish to Telegram
        run: |
          python bot.py "${{ steps.category.outputs.category }}"