name: Money Maker Telegram Automation

on:

  workflow_dispatch:
    inputs:
      category:
        description: "Post category"
        required: true
        default: "product"
        type: choice
        options:
          - cashapp_daily
          - product
          - evening
          - education
          - strategy
          - store
          - faq
          - support
          - cta
          - night
          - welcome

  schedule:

    # 09:00 New York
    - cron: "0 9 * * *"
      timezone: "America/New_York"

    # 12:30 New York
    # CASHAPP TRANSFER SAUCE every day
    - cron: "30 12 * * *"
      timezone: "America/New_York"

    # 15:30 New York
    - cron: "30 15 * * *"
      timezone: "America/New_York"

    # 18:30 New York
    # Second product slot
    - cron: "30 18 * * *"
      timezone: "America/New_York"

    # 21:30 New York
    - cron: "30 21 * * *"
      timezone: "America/New_York"


jobs:

  telegram-post:

    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
      SUPPORT_USERNAME: ${{ secrets.SUPPORT_USERNAME }}
      STORE_URL: ${{ secrets.STORE_URL }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Determine publication
        id: publication
        shell: bash
        run: |

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then

            COMMAND="${{ inputs.category }}"

          else

            SCHEDULE="${{ github.event.schedule }}"

            case "$SCHEDULE" in

              "0 9 * * *")
                COMMAND="education"
                ;;

              "30 12 * * *")
                COMMAND="cashapp_daily"
                ;;

              "30 15 * * *")
                COMMAND="strategy"
                ;;

              "30 18 * * *")
                COMMAND="evening"
                ;;

              "30 21 * * *")
                COMMAND="night"
                ;;

              *)
                echo "Unknown schedule: $SCHEDULE"
                exit 1
                ;;

            esac

          fi

          echo "command=$COMMAND" >> "$GITHUB_OUTPUT"

          echo "========================================"
          echo " MONEY MAKER"
          echo " COMMAND: $COMMAND"
          echo "========================================"

      - name: Publish to Telegram
        run: |
          python bot.py "${{ steps.publication.outputs.command }}"